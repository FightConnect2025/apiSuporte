services:
  api-suporte:
    build:
      context: .
      args:
        PROFILE: prod
        PORT: 9086
    container_name: api-suporte-prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-9086}:9086"
    environment:
      SERVER_PORT: 9086
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-fightconnect}
      API_AUTH_BASE_URL: ${API_AUTH_URL:-http://localhost:9081}
      API_FIGHT_URL: ${API_FIGHT_URL:-http://localhost:9082}
      API_FINANCEIRO_URL: ${API_FINANCEIRO_URL:-http://localhost:9084}
      API_LOGS_URL: ${API_LOGS_URL:-https://localhost:9083}
      APP_STORAGE_BASE_PATH: ${APP_STORAGE_BASE_PATH:-/data/images}
    volumes:
      - ./images:/data/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fightconnect-network

networks:
  fightconnect-network:
    driver: bridge
