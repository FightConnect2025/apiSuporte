version: "3.9"

services:
  postgres-suporte:
    image: postgres:15
    container_name: postgres-suporte
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"   # host:container (pra você acessar do seu PC)
    volumes:
      - suporte_pgdata:/var/lib/postgresql/data
    networks:
      - fightconnect-network

  api-suporte:
    build: .
    container_name: api-suporte
    restart: unless-stopped
    depends_on:
      - postgres-suporte
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: dev

      # ✅ DB: dentro do docker usa o nome do serviço e porta 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-suporte:5432/helpdesk
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # ✅ Rabbit já existente no HOST (Windows)
      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # (opcional) se essa API auth roda no host, mantém assim.
      # se ela roda em outro container, aí tem que ajustar (ver abaixo)
      API_AUTH_BASE_URL: https://host.docker.internal:8081

      # ✅ storage no container (se você usa path Windows no properties, isso quebra no Linux do container)
      # então sobrescreve para path linux dentro do container:
      APP_STORAGE_BASE_PATH: /data/images
    volumes:
      # mapeia uma pasta do host pra dentro do container (troca o caminho do host se quiser)
      - ./images:/data/images
    networks:
      - fightconnect-network

volumes:
  suporte_pgdata:

networks:
  fightconnect-network:
    driver: bridge
