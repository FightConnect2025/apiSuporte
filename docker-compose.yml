services:
  postgres-suporte:
    image: postgres:15
    container_name: postgres-suporte
    restart: always
    # Banco interno — porta NAO exposta no host para evitar conflito com postgres de prod
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: coti
    volumes:
      - suporte_pgdata:/var/lib/postgresql/data
    networks:
      - fightconnect-network
      - fightconnect-homolog-net

  api-suporte:
    image: fightconnect/api-suporte:homolog
    build:
      context: .
      args:
        PROFILE: homolog
        PORT: 7086
    container_name: api-suporte
    restart: unless-stopped
    depends_on:
      - postgres-suporte
    ports:
      - "${API_PORT:-7086}:7086"
    env_file:
      - config/.env
    environment:
      # Overrides Docker-only (o .env da VPS aponta para localhost)
      SERVER_PORT: 7086
      SPRING_PROFILES_ACTIVE: homolog
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-suporte:5432/helpdesk
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: coti
      REDIS_HOST: redis-homolog
      REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: 5672
      API_AUTH_URL: http://host.docker.internal:7081
      API_FIGHT_URL: http://host.docker.internal:7082
      API_FINANCEIRO_URL: http://host.docker.internal:7084
      API_LOGS_URL: http://host.docker.internal:7083
      APP_STORAGE_BASE_PATH: /data/images
    volumes:
      - ./images:/data/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fightconnect-network
      - fightconnect-homolog-net

volumes:
  suporte_pgdata:

networks:
  fightconnect-network:
    driver: bridge
  fightconnect-homolog-net:
    external: true
