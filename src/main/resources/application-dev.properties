server.port=8086

# ===== DATABASE (DEV - Docker local) =====
spring.datasource.url=jdbc:postgresql://localhost:5435/helpdesk
spring.datasource.username=postgres
spring.datasource.password=coti
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# (opcional) logs melhores
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

app.mail.support-to=suporte@fightconnect.com.br
app.storage.public-host=https://app.fightconnect.com.br
 

app.storage.base-path=C:\\workspace\\images
app.storage.public-base-url=/images


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB



spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# === PUSH EVENTS (tem que bater com o worker) ===
app.rabbit.exchange=events.fightconnect
app.rabbit.routing-notify=notify


api.auth.base-url=https://localhost:8081
api.auth.timeout-ms=5000


jwt.secret=7f03a2e0-f9ac-47ca-b72f-76e9d4b67e45
jwt.expiration=86400000

internal.api.key=fight-internal-service-key-dev

# Auth provider: jwt-local (legado) ou keycloak
auth.provider=jwt-local

