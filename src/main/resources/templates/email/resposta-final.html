<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f6; margin: 0; padding: 0; }
  .container { max-width: 600px; margin: 20px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 32px; text-align: center; }
  .header h1 { color: #e94560; margin: 0; font-size: 24px; }
  .header p { color: #a0a0b0; margin: 8px 0 0; font-size: 14px; }
  .content { padding: 32px; }
  .label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 4px; }
  .value { color: #1a1a2e; font-size: 16px; margin: 0 0 8px; }
  .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
  .answer-box { background: #f0fdf4; border: 2px solid #22c55e; border-radius: 8px; padding: 20px; margin: 16px 0; }
  .answer-box p { margin: 0; color: #166534; line-height: 1.6; font-size: 15px; }
  .badge-resolvido { display: inline-block; padding: 6px 16px; background: #22c55e; color: #fff; border-radius: 12px; font-size: 13px; font-weight: 600; }
  .footer { text-align: center; padding: 24px; color: #999; font-size: 12px; border-top: 1px solid #eee; }
  .btn { display: inline-block; padding: 12px 24px; background: #e94560; color: #fff; text-decoration: none; border-radius: 6px; margin: 16px 0; font-weight: 600; }
  .feedback { text-align: center; margin: 24px 0; padding: 16px; background: #fefce8; border-radius: 8px; }
  .feedback p { color: #854d0e; font-size: 13px; margin: 0 0 8px; }
  .star { font-size: 28px; color: #eab308; cursor: pointer; text-decoration: none; margin: 0 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>FightConnect</h1>
    <p>Seu ticket foi respondido</p>
  </div>
  <div class="content">
    <div class="label">Ticket</div>
    <div class="value" th:text="${ticketNumero}">0001</div>

    <div class="label">Titulo</div>
    <div class="value" th:text="${titulo}">Titulo do ticket</div>

    <hr class="divider">

    <div style="text-align:center; margin: 16px 0;">
      <span class="badge-resolvido" th:text="${status}">RESOLVIDO</span>
    </div>

    <div class="label">Resposta do Suporte</div>
    <div class="answer-box">
      <p th:text="${resposta}">Resposta do suporte...</p>
    </div>

    <div style="text-align:center; margin: 24px 0;">
      <a class="btn" th:href="${url}" target="_blank">Ver Ticket</a>
    </div>

    <div class="feedback">
      <p>Avalie o atendimento:</p>
      <a class="star" th:href="${feedbackUrl}1" target="_blank">&#9733;</a>
      <a class="star" th:href="${feedbackUrl}2" target="_blank">&#9733;</a>
      <a class="star" th:href="${feedbackUrl}3" target="_blank">&#9733;</a>
      <a class="star" th:href="${feedbackUrl}4" target="_blank">&#9733;</a>
      <a class="star" th:href="${feedbackUrl}5" target="_blank">&#9733;</a>
    </div>
  </div>
  <div class="footer">
    Enviado automaticamente pelo sistema FightConnect<br>
    &copy; 2026 FightConnect
  </div>
</div>
</body>
</html>
