spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbit.exchange=test.exchange
app.rabbit.routing-notify=test.notify
api.auth.base-url=http://localhost:9999
api.auth.timeout-ms=100
jwt.secret=test-jwt-secret-key-for-unit-tests-only
internal.api.key=test-internal-key
app.mail.support-to=teste@fightconnect.com.br
app.storage.base-path=./test-uploads
app.storage.public-base-url=/test-images
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
